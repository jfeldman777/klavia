name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # static export compatible: Next will emit .next; for Pages use `out` if configured
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Prepare Pages artifact from Next standalone/static
        run: |
          # Prefer static export folder if present; else copy .next/static + public into a simple static shell is insufficient for App Router.
          # We use `output: 'export'` in next.config — expect `out/`.
          if [ -d out ]; then
            echo "Using out/"
          else
            echo "out/ missing — ensure next.config has output: 'export'" >&2
            ls -la
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
